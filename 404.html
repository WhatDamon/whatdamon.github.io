<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <script>
      var p = location.pathname + location.search;
      if (sessionStorage.getItem("_404g") === p) {
        sessionStorage.removeItem("_404g");
        sessionStorage.removeItem("r");
        location.replace(p.startsWith("/museum/") ? "/museum/" : "/");
      } else {
        sessionStorage.setItem("_404g", p);
        sessionStorage.setItem("r", p);
        location.replace(p.startsWith("/museum/") ? "/museum/" : "/");
      }
    </script>
  </body>
</html>
