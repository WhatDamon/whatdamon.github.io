    <script>
      (function () {
        // Check optout cookie
        if (document.cookie.indexOf("legacy_optout=1") !== -1) return;

        function redirectToLegacy() {
          var path = window.location.pathname;
          // Already on legacy? Don't redirect
          if (path.indexOf("/museum/legacy/") === 0) return;

          // Normalize trailing slash
          if (path.length > 1 && path.charAt(path.length - 1) === "/") {
            path = path.slice(0, -1);
          }

          // Redirect to the matching legacy article, or index as fallback
          if (path === "/museum/1-flash1.0") {
            window.location = "/museum/legacy/1-flash1.0.html";
          } else if (path === "/museum/2-ppt1.0") {
            window.location = "/museum/legacy/2-ppt1.0.html";
          } else if (path === "/museum/3-netants") {
            window.location = "/museum/legacy/3-netants.html";
          } else if (path === "/museum/4-rainmeter") {
            window.location = "/museum/legacy/4-rainmeter.html";
          } else if (path === "/museum/5-appleworks6win") {
            window.location = "/museum/legacy/5-appleworks6win.html";
          } else {
            window.location = "/museum/legacy/index.html";
          }
        }

        var hasESM =
          "noModule" in document.createElement("script") ||
          (typeof HTMLScriptElement !== "undefined" &&
            typeof HTMLScriptElement.supports === "function" &&
            HTMLScriptElement.supports("module"));

        if (!hasESM) {
          redirectToLegacy();
          return;
        }

        var missing = [];
        if (typeof Promise === "undefined") missing.push("Promise");
        if (typeof fetch === "undefined") missing.push("fetch()");
        if (typeof Map === "undefined" || typeof Set === "undefined")
          missing.push("Map/Set");
        if (typeof MutationObserver === "undefined")
          missing.push("MutationObserver");
        if (typeof DOMParser === "undefined") missing.push("DOMParser");

        if (missing.length > 0) {
          redirectToLegacy();
        }
      })();
    </script>
