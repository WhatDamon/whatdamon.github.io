  <body>
    <script>
      (function () {
        // Check optout cookie
        if (document.cookie.includes("legacy_optout=1")) return;

        function redirectToLegacy() {
          var path = window.location.pathname;
          // Already on legacy? Don't redirect
          if (path.startsWith("/museum/legacy/")) return;

          // Normalize trailing slash
          if (path.length > 1 && path.charAt(path.length - 1) === "/") {
            path = path.slice(0, -1);
          }

          // Redirect to the matching legacy article, or index as fallback
          var redirects = {
            "/museum/1-flash1.0": "/museum/legacy/1-flash1.0.html",
            "/museum/2-ppt1.0": "/museum/legacy/2-ppt1.0.html",
            "/museum/3-netants": "/museum/legacy/3-netants.html",
            "/museum/4-rainmeter": "/museum/legacy/4-rainmeter.html",
            "/museum/5-appleworks6win": "/museum/legacy/5-appleworks6win.html",
          };
          var target = redirects[path] || "/museum/legacy/index.html";
          location.assign(target);
        }

        var hasESM =
          "noModule" in document.createElement("script") ||
          (typeof HTMLScriptElement !== "undefined" &&
            typeof HTMLScriptElement.supports === "function" &&
            HTMLScriptElement.supports("module"));

        if (!hasESM) {
          redirectToLegacy();
          return;
        }

        var missing = [];
        if (Promise === undefined) missing.push("Promise");
        if (fetch === undefined) missing.push("fetch()");
        if (Map === undefined || Set === undefined) missing.push("Map/Set");
        if (MutationObserver === undefined) missing.push("MutationObserver");
        if (DOMParser === undefined) missing.push("DOMParser");

        if (missing.length > 0) {
          redirectToLegacy();
        }
      })();
    </script>

    <main>
      <div class="window">
        <div class="title-bar">
          <div class="title-bar-text"></div>
          <div class="title-bar-controls">
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body" id="app"></div>
      </div>
      <script>
        // Rafgraph redirect restore — decode query string back to museum path
        // Must run BEFORE the SPA module script
        (function () {
          var q = location.search.slice(1);
          if (q && q.charAt(0) === "/") {
            var path = q,
              query = "",
              hash = location.hash;
            var ampIndex = q.indexOf("&");
            if (ampIndex !== -1) {
              path = q.slice(0, ampIndex);
              query = q.slice(ampIndex + 1).replace(/~and~/g, "&");
            }
            // Remove leading slash — /museum/ already has it
            if (path.charAt(0) === "/") path = path.slice(1);
            history.replaceState(
              null,
              null,
              "/museum/" + path + (query ? "?" + query : "") + hash,
            );
          }
        })();
      </script>
    </main>
  </body>
